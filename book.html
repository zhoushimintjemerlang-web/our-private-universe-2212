
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. & Mrs. Bubs</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #493326;
  font-family: Georgia, "Times New Roman", serif;
  color: #493326;
}

.book {
  width: 100%;
  max-width: 570px;
  padding: 14px;
  background: #6d4c35;
  border: 1px solid #b99a70;
  box-shadow: 0 18px 50px #21140f80;
}

.paper {
  min-height: 680px;
  padding: 25px 24px;
  display: flex;
  flex-direction: column;
  background: #f3ead9;
  border: 1px solid #c9b18b;
  outline: 1px solid #c9b18b;
  outline-offset: -7px;
}

.page-number {
  text-align: right;
  color: #8c7052;
  font-size: 11px;
  letter-spacing: 2px;
}

.message-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 45px 12px;
  text-align: center;
  animation: fadeIn .4s ease;
}

.message {
  max-width: 440px;
  font-size: clamp(23px, 5vw, 34px);
  line-height: 1.6;
  font-weight: normal;
  font-style: italic;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding-top: 18px;
  border-top: 1px solid #c9b18b;
}

button {
  min-width: 110px;
  padding: 11px 16px;
  border: 1px solid #8c7052;
  background: transparent;
  color: #493326;
  font-family: Georgia, serif;
  font-size: 13px;
  cursor: pointer;
}

button.next {
  background: #493326;
  color: #f3ead9;
}

button:disabled {
  opacity: .3;
  cursor: default;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 480px) {
  .paper {
    min-height: 78vh;
    padding: 24px 17px;
  }

  .message-area {
    padding: 35px 8px;
  }

  button {
    min-width: 95px;
  }
}
</style>
</head>

<body>

<div class="book">
  <div class="paper">

    <div class="page-number" id="pageNumber">01 / 08</div>

    <main class="message-area" id="messageArea">
      <div class="message" id="message">
        Your message goes here.
      </div>
    </main>

    <nav class="navigation">
      <button id="prev" onclick="changePage(-1)">← Previous</button>
      <button id="next" class="next" onclick="changePage(1)">Next →</button>
    </nav>

  </div>
</div>

<script>
const pages = [
  "Your first message goes here.",
  "Your second message goes here.",
  "Your third message goes here.",
  "Your fourth message goes here.",
  "Your fifth message goes here.",
  "Your sixth message goes here.",
  "Your seventh message goes here.",
  "Your final message goes here."
];

let currentPage = 0;

function renderPage() {
  const message = document.getElementById("message");
  const area = document.getElementById("messageArea");

  area.style.animation = "none";
  void area.offsetWidth;
  area.style.animation = "fadeIn .4s ease";

  message.textContent = pages[currentPage];

  document.getElementById("pageNumber").textContent =
    String(currentPage + 1).padStart(2, "0") +
    " / " +
    String(pages.length).padStart(2, "0");

  document.getElementById("prev").disabled = currentPage === 0;
  document.getElementById("next").disabled =
    currentPage === pages.length - 1;
}

function changePage(direction) {
  const nextPage = currentPage + direction;

  if (nextPage < 0 || nextPage >= pages.length) return;

  currentPage = nextPage;
  renderPage();
}

renderPage();
</script>

</body>
</html>
