        <style>
:root {
  --emerald: #062b24;
  --emerald-deep: #031713;
  --gold: #d6b56e;
  --gold-soft: #a98545;
  --ivory: #f3e9d2;
}
* { box-sizing: border-box; }
.staticrypt-html, .staticrypt-body { min-height: 100%; margin: 0; }
.staticrypt-body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 38%, rgba(24, 83, 65, .48), transparent 48%),
    radial-gradient(ellipse at 50% 100%, rgba(0, 0, 0, .72), transparent 58%),
    linear-gradient(135deg, #020d0b 0%, #07352b 48%, #020e0c 100%);
  color: var(--ivory);
  font-family: "Lora", Georgia, "Times New Roman", serif;
  font-weight: 700;
  -webkit-font-smoothing: antialiased;
}
.staticrypt-content {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 34px 18px;
  position: relative;
  overflow: hidden;
  background: transparent;
}
.staticrypt-content::before {
  content: "";
  position: fixed;
  inset: 18px;
  border: 1px solid rgba(214, 181, 110, .58);
  pointer-events: none;
}
.staticrypt-content::after {
  content: "";
  position: fixed;
  inset: 25px;
  border: 1px solid rgba(214, 181, 110, .18);
  pointer-events: none;
}
.staticrypt-page {
  width: 100%;
  max-width: 440px;
  margin: auto;
  padding: 0;
  position: relative;
  z-index: 1;
}
.staticrypt-form {
  position: relative;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: 42px 34px 36px;
  text-align: center;
  background: linear-gradient(155deg, rgba(7, 38, 32, .97), rgba(2, 17, 14, .98));
  border: 1px solid var(--gold-soft);
  outline: 1px solid rgba(214, 181, 110, .25);
  outline-offset: 7px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, .55), inset 0 0 35px rgba(214, 181, 110, .035);
}
.staticrypt-monogram {
  width: 92px;
  height: 92px;
  margin: 0 auto 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--gold);
  font-family: "Lora", Georgia, serif;
  font-weight: 800;
  font-size: 37px;
  letter-spacing: -4px;
  padding-right: 4px;
  text-shadow: 0 2px 14px rgba(214, 181, 110, .2);
}
.staticrypt-monogram::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid var(--gold);
  border-radius: 50%;
}
.zodiac-emblem {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  color: var(--gold);
  opacity: .95;
  filter: drop-shadow(0 0 4px rgba(214, 181, 110, .18));
}
.zodiac-emblem svg {
  position: absolute;
  top: 50%;
  width: 19px;
  height: 28px;
  overflow: visible;
  transform: translateY(-50%);
}
.zodiac-emblem .cancer { left: -18px; }
.zodiac-emblem .capricorn { right: -18px; }
.zodiac-emblem .constellation-line {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.05;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.zodiac-emblem .star { fill: currentColor; }
@media (max-width: 480px) {
  .zodiac-emblem svg { width: 16px; height: 24px; }
  .zodiac-emblem .cancer { left: -15px; }
  .zodiac-emblem .capricorn { right: -15px; }
}
.staticrypt-instructions { margin: 0 0 27px; }
.staticrypt-title {
  margin: 0;
  color: var(--gold);
  font-family: "Lora", Georgia, "Times New Roman", serif;
  font-size: clamp(20px, 4.7vw, 24px);
  font-weight: 800;
  line-height: 1.48;
  letter-spacing: .1px;
}
.staticrypt-title .title-main {
  display: block;
  font-family: "Lora", Georgia, serif;
  font-weight: 800;
}
.staticrypt-title .title-names {
  display: block;
  margin-top: 3px;
  color: var(--gold);
  font-family: "Great Vibes", "Brush Script MT", "Segoe Script", cursive;
  font-size: clamp(50px, 10vw, 62px);
  font-weight: 400;
  line-height: 1.18;
  letter-spacing: 0;
  -webkit-text-stroke: .35px currentColor;
  text-shadow: 0 1px 1px rgba(214, 181, 110, .22);
}
.staticrypt-hr {
  width: auto;
  margin: 22px auto 24px;
  border: 0;
  color: var(--gold);
  font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
  font-size: 21px;
  letter-spacing: 5px;
  line-height: 1.3;
  opacity: .95;
}
.staticrypt-password-container {
  position: relative;
  width: 100%;
  margin: 0 0 18px;
  background: rgba(0, 0, 0, .22);
  border: 1px solid rgba(214, 181, 110, .62);
}
.staticrypt-form input[type="password"],
.staticrypt-form input[type="text"] {
  display: block;
  width: 100%;
  padding: 16px 44px 16px 16px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ivory);
  font-family: "Lora", Georgia, "Times New Roman", serif;
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}
.staticrypt-form input::placeholder { color: rgba(243, 233, 210, .78); opacity: 1; font-family: "Lora", Georgia, serif; font-weight: 700; }
.staticrypt-toggle-password-visibility {
  position: absolute;
  top: 50%;
  right: 10px;
  width: 19px;
  height: 19px;
  padding: 0;
  opacity: .72;
  filter: invert(82%) sepia(27%) saturate(560%) hue-rotate(5deg) brightness(92%);
  transform: translateY(-50%);
  cursor: pointer;
}
.staticrypt-form .staticrypt-decrypt-button {
  width: 100%;
  padding: 16px 14px;
  border: 1px solid #e6c982;
  outline: 1px solid rgba(214, 181, 110, .22);
  outline-offset: 3px;
  background: linear-gradient(135deg, #e4c77f, #b88c43);
  color: #10271f;
  font-family: "Lora", Georgia, "Times New Roman", serif;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
  cursor: pointer;
  transition: filter .2s ease, transform .2s ease;
}
.staticrypt-form .staticrypt-decrypt-button:hover,
.staticrypt-form .staticrypt-decrypt-button:focus {
  filter: brightness(1.1);
}
.staticrypt-form .staticrypt-decrypt-button:active { transform: translateY(1px); }
.staticrypt-remember { color: var(--ivory); }
.staticrypt-remember input { accent-color: var(--gold); }
.hidden { display: none !important; }
.staticrypt-spinner-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--emerald-deep);
}
.staticrypt-spinner {
  display: inline-block;
  width: 2rem;
  height: 2rem;
  border: .22em solid rgba(214, 181, 110, .35);
  border-right-color: transparent;
  border-radius: 50%;
  animation: spinner-border .75s linear infinite;
}
@keyframes spinner-border { to { transform: rotate(360deg); } }
@media (max-width: 480px) {
  .staticrypt-content { padding: 28px 25px; }
  .staticrypt-content::before { inset: 12px; }
  .staticrypt-content::after { inset: 18px; }
  .staticrypt-form { padding: 35px 23px 30px; }
  .staticrypt-monogram { width: 82px; height: 82px; font-size: 34px; margin-bottom: 23px; }
}

/* Unified typography: every piece of page text uses a bold, refined connected script. */
.staticrypt-body,
.staticrypt-body button,
.staticrypt-body input,
.staticrypt-body label,
.staticrypt-monogram,
.staticrypt-title,
.staticrypt-title .title-main,
.staticrypt-title .title-names,
.staticrypt-form input[type="password"],
.staticrypt-form input[type="text"],
.staticrypt-form input::placeholder,
.staticrypt-form .staticrypt-decrypt-button,
.staticrypt-remember {
  font-family: "Dancing Script", "Segoe Script", "Brush Script MT", cursive !important;
  font-weight: 700 !important;
  font-style: normal;
}
.staticrypt-monogram { font-size: 39px; letter-spacing: -1px; padding-right: 0; }
.staticrypt-title { font-size: clamp(25px, 5vw, 30px); line-height: 1.35; }
.staticrypt-title .title-main,
.staticrypt-title .title-names {
  display: block;
  color: var(--gold);
  font-family: "Dancing Script", "Segoe Script", "Brush Script MT", cursive !important;
  font-size: inherit;
  font-weight: 700 !important;
  line-height: 1.35;
  letter-spacing: 0;
  -webkit-text-stroke: .15px currentColor;
}
.staticrypt-title .title-names { margin-top: 2px; }
.staticrypt-form input[type="password"],
.staticrypt-form input[type="text"] { font-size: 19px; }
.staticrypt-form input::placeholder { font-size: 19px; }
.staticrypt-form .staticrypt-decrypt-button { font-size: 20px; letter-spacing: .5px; }
.staticrypt-remember { font-size: 17px; }

</style>
    </head>

<script>
(() => {
  const TEMPORARY_PASSWORD = "123456";
  const bookHTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Mr. & Mrs. Bubs</title>\n\n<style>\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  padding: 20px 12px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  background: #493326;\n  font-family: Georgia, \"Times New Roman\", serif;\n  color: #493326;\n}\n\n.book {\n  width: 100%;\n  max-width: 650px;\n  padding: 14px;\n  background: #6d4c35;\n  border: 1px solid #b99a70;\n  box-shadow: 0 18px 50px #21140f80;\n}\n\n.paper {\n  min-height: 680px;\n  padding: 25px 24px;\n  display: flex;\n  flex-direction: column;\n  background: #f3ead9;\n  border: 1px solid #c9b18b;\n  outline: 1px solid #c9b18b;\n  outline-offset: -7px;\n}\n\n.page-number {\n  text-align: right;\n  color: #8c7052;\n  font-size: 11px;\n  letter-spacing: 2px;\n}\n\n.message-area {\n  flex: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 35px 12px;\n  text-align: center;\n  animation: fadeIn .4s ease;\n}\n\n.message {\n  max-width: 490px;\n  font-size: clamp(18px, 3.5vw, 25px);\n  line-height: 1.65;\n  font-weight: normal;\n  font-style: italic;\n  white-space: pre-line;\n  overflow-wrap: anywhere;\n}\n\n.navigation {\n  display: flex;\n  justify-content: space-between;\n  gap: 12px;\n  padding-top: 18px;\n  border-top: 1px solid #c9b18b;\n}\n\nbutton {\n  min-width: 110px;\n  padding: 11px 16px;\n  border: 1px solid #8c7052;\n  background: transparent;\n  color: #493326;\n  font-family: Georgia, serif;\n  font-size: 13px;\n  cursor: pointer;\n}\n\nbutton.next {\n  background: #493326;\n  color: #f3ead9;\n}\n\nbutton:disabled {\n  opacity: .3;\n  cursor: default;\n}\n\n@keyframes fadeIn {\n  from {\n    opacity: 0;\n    transform: translateY(8px);\n  }\n  to {\n    opacity: 1;\n    transform: translateY(0);\n  }\n}\n\n@media (max-width: 480px) {\n  .paper {\n    min-height: 78vh;\n    padding: 24px 17px;\n  }\n\n  .message-area {\n    padding: 30px 8px;\n  }\n\n  .message {\n    font-size: 19px;\n  }\n\n  button {\n    min-width: 95px;\n  }\n}\n</style>\n</head>\n\n<body>\n\n<div class=\"book\">\n  <div class=\"paper\">\n\n    <div class=\"page-number\" id=\"pageNumber\">01 / 32</div>\n\n    <main class=\"message-area\" id=\"messageArea\">\n      <div class=\"message\" id=\"message\"></div>\n    </main>\n\n    <nav class=\"navigation\">\n      <button id=\"prev\" onclick=\"changePage(-1)\">← Previous</button>\n      <button id=\"next\" class=\"next\" onclick=\"changePage(1)\">Next →</button>\n    </nav>\n\n  </div>\n</div>\n\n<script>\nconst pages = [\n\n  // PAGE 01\n  `Happy Sweet Seventeen ya sayang 🎉`,\n\n  // PAGE 02\n  `Ehhh...`,\n\n  // PAGE 03\n  `Happy Birthday maksudnya... kan sudah tidak muda lagi 😂`,\n\n  // PAGE 04\n  `Happy Birthday yang ke-22 ya sayang!`,\n\n  // PAGE 05\n  `Well, jokes aside...`,\n\n  // PAGE 06\n  `Another year older, another year more wonderful.`,\n\n  // PAGE 07\n  `I hope this new chapter brings you endless happiness.`,\n\n  // PAGE 08\n  `(And for us too i guess?) 😅`,\n\n  // PAGE 09\n  `May you always find reasons to smile, even on difficult days.`,\n\n  // PAGE 10\n  `Hmmm...`,\n\n  // PAGE 11\n  `Apa lagi ya?`,\n\n  // PAGE 12\n  `Aku berharap, di usia kamu yang sekarang, ada semakin banyak hal baik yang datang ke dalam hidup kamu. Bukan hanya untuk kamu, tetapi juga untuk Papa, Mama, dan kedua adik kamu yang ganteng itu.\n\n(Aku juga gak kalah ganteng kan?) 😎`,\n\n  // PAGE 13\n  `Semoga Tuhan selalu menjaga keluarga kecil kalian, memberikan kesehatan dan menyertai setiap langkah kalian.\n\n(Kalau ditambah aku dan anak aku, mungkin bisa jadi keluarga besar ya.) 🫶\n\nSemoga kalian selalu punya waktu untuk berkumpul, berbagi cerita, tertawa bersama, dan menciptakan lebih banyak kenangan indah.\n\n(Aku mau join pleaseee!)\n\nHopefully, one day i will be more than just nar-benar datang dengan hati yang sama-sama utuh. Gak ada bayang-bayang seseorang, gak ada perasaan yang masih tertinggal, dan gak ada hal tersembunyi yang suatu saat bisa membuat kita mempertanyakan satu sama lain.`,\n\n  // PAGE 22\n  `Aku ingin hubungan ini menjadi tempat kita pulang. Tempat di mana kita sama-sama merasa nyaman, AMAN, dihargai, dan gak perlu terus-menerus meragukan posisi masing-masing. Aku ingin kamu bisa merasa aman bersamaku, sebagaimana aku juga ingin merasakan hal yang sama darimu.`,\n\n  // PAGE 23\n  `Aku ingin kamu terus berkembang, aku juga ingin terus berkembang, dan aku ingin kita bertumbuh bersama. Bukan menjadi dua orang yang harus selalu sempurna untuk satu sama lain, tetapi dua orang yang mau terus belajar, memperbaiki diri, dan saling memahami.`,\n\n  // PAGE 24\n  `Karena kalau boleh jujur, ketika aku membayangkan masa depanku, aku gak hanya membayangkan tentang memiliki seseorang untuk menemani hari-hariku. Aku membayangkan sebuah persatuan, sebuah keluarga, dan kehidupan yang ingin aku bangun bersama kamu.`,\n\n  // PAGE 25\n  `Dan orang yang aku lihat dalam bayangan itu adalah kamu.`,\n\n  // PAGE 26\n  `Eaaak sok keren lu dah pin 🤗😂🤣😭🙏`,\n\n  // PAGE 27\n  `Kalau kata Fajar Sadboy mahhh...`,\n\n  // PAGE 28\n  `LDR berat nih bosss!`,\n\n  // PAGE 29\n  `Kukuk kukuk kukk kukk`,\n\n  // PAGE 30\n  `Sudah ya sayang ni last yapping....`,\n\n  // PAGE 31\n  `Aku malu deh....`,\n\n  // PAGE 32\n  `Intinya Love youuu so muchhh 🥰`\n\n];\n\nlet currentPage = 0;\n\nfunction renderPage() {\n  const message = document.getElementById(\"message\");\n  const area = document.getElementById(\"messageArea\");\n\n  area.style.animation = \"none\";\n  void area.offsetWidth;\n  area.style.animation = \"fadeIn .4s ease\";\n\n  message.textContent = pages[currentPage];\n\n  document.getElementById(\"pageNumber\").textContent =\n    String(currentPage + 1).padStart(2, \"0\") +\n    \" / \" +\n    String(pages.length).padStart(2, \"0\");\n\n  documen
