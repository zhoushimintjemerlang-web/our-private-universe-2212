
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private Universe</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f0e8;
            color: #39342f;
            font-family: Georgia, serif;
            text-align: center;
        }

        .container {
            padding: 30px;
            max-width: 500px;
        }

        h1 {
            font-size: 36px;
            font-weight: normal;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            color: #777067;
        }

        .label {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="label">A little place for us</div>

        <h1>Our Private Universe</h1>

        <p>
            A collection of moments, words,

        </p>

        <p>Something beautiful is waiting here.</p>
    </div>

</html>
